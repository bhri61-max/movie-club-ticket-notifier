name: 오디세이 광교 IMAX 보조 감시

on:
  workflow_dispatch:
  schedule:
    # 매시간 2분에 새 감시를 시작하고 약 59분간 실행
    # GitHub 스케줄 지연을 고려해 다음 실행과의 겹침을 최소화
    - cron: "2 * * * *"

concurrency:
  group: odyssey-gwanggyo-imax-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 62

    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chrome 및 ChromeDriver 설치
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "151"
          install-chromedriver: true
          install-dependencies: true

      - name: Telegram Secret 적용
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          p = Path("config.yaml")
          text = p.read_text(encoding="utf-8")

          text = text.replace(
              'bot_token: "YOUR_BOT_TOKEN_HERE"',
              f'bot_token: "{os.environ["TELEGRAM_BOT_TOKEN"]}"'
          )

          text = text.replace(
              '- "YOUR_CHAT_ID_HERE"',
              f'- "{os.environ["TELEGRAM_CHAT_ID"]}"'
          )

          p.write_text(text, encoding="utf-8")
          PY

      - name: Telegram 시작 테스트 메시지
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          text = "✅ 오디세이 광교 IMAX 감시가 시작되었습니다. 5분마다 확인합니다."
          data = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as r:
              result = json.loads(r.read().decode())
          if not result.get("ok"):
              raise SystemExit(f"Telegram 전송 실패: {result}")
          print("Telegram 시작 테스트 메시지 전송 성공")
          PY

      - name: CGV 감시 실행
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          echo "Chrome: $CHROME_PATH"
          echo "ChromeDriver: $CHROMEDRIVER_PATH"
          timeout 3540 python main.py || true
