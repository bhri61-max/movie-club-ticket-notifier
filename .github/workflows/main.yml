name: 오디세이 광교 IMAX 보조 감시

on:
  workflow_dispatch:
  # 이번 수정본을 즉시 대기열에 올리기 위한 임시 트리거
  push:
    paths:
      - ".github/workflows/main.yml"
  schedule:
    # 연속 감시가 끊겼을 때만 살리는 비상용 백업 (6시간마다)
    - cron: "17 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: odyssey-gwanggyo-imax-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 62

    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chrome 및 ChromeDriver 설치
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "151"
          install-chromedriver: true
          install-dependencies: true

      - name: Telegram Secret 적용
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          p = Path("config.yaml")
          text = p.read_text(encoding="utf-8")

          text = text.replace(
              'bot_token: "YOUR_BOT_TOKEN_HERE"',
              f'bot_token: "{os.environ["TELEGRAM_BOT_TOKEN"]}"'
          )

          text = text.replace(
              '- "YOUR_CHAT_ID_HERE"',
              f'- "{os.environ["TELEGRAM_CHAT_ID"]}"'
          )

          p.write_text(text, encoding="utf-8")
          PY

      - name: CGV 감시 실행
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          echo "Chrome: $CHROME_PATH"
          echo "ChromeDriver: $CHROMEDRIVER_PATH"

          set +e
          timeout --signal=INT --kill-after=30s 3540s python -u main.py
          code=$?

          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            echo "정상: 59분 감시 완료"
            exit 0
          fi

          exit "$code"

      - name: 상태 파일 저장
        if: always()
        run: |
          if compgen -G "data/state/*.json" > /dev/null; then
            git config user.name "cgv-imax-monitor"
            git config user.email "actions@github.com"
            git add -f data/state/*.json

            if ! git diff --cached --quiet; then
              git commit -m "Update IMAX monitor state [skip ci]"
              git reset --hard HEAD
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
              echo "IMAX 감시 상태 저장 완료"
            else
              echo "상태 변경 없음"
            fi
          else
            echo "저장할 상태 파일 없음"
          fi

      - name: 다음 감시 시작 예약
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "현재 감시가 끝났으므로 다음 감시를 지금 예약합니다."
          curl --fail-with-body -sS -L -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/dispatches"             -d '{"ref":"main"}'
          echo "다음 감시 예약 완료"
