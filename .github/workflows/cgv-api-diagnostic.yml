name: CGV API diagnostic

on:
  push:
    paths:
      - ".github/workflows/cgv-api-diagnostic.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect CGV API fields
        run: |
          pip install -q requests
          python - <<'PY'
          import json, requests
          headers = {
            "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
            "Accept": "application/json, text/plain, */*",
            "Accept-Language": "ko-KR,ko;q=0.9",
            "Referer": "https://cgv.co.kr/cnm/movieBook/cinema",
          }
          for ymd in ["20260918","20260919","20260920","20260921","20260922","20260923"]:
              url=f"https://cgv.co.kr/api/v1/booking/searchMovScnInfo?coCd=A420&siteNo=0257&scnYmd={ymd}&rtctlScopCd=08"
              r=requests.get(url,headers=headers,timeout=20)
              print("HTTP",ymd,r.status_code)
              data=(r.json().get("data") or []) if r.status_code==200 else []
              rows=[x for x in data if "오디세이" in str(x.get("movNm","")) and "IMAX" in (str(x.get("scnsNm",""))+" "+str(x.get("movkndDsplNm",""))).upper()]
              print("DATE",ymd,"ROWS",len(rows))
              for x in rows[:2]:
                  print(json.dumps(x,ensure_ascii=False,sort_keys=True))
          PY
